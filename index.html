<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Site Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #020617;
  border-bottom: 1px solid #1e293b;
}

nav h1 {
  margin: 0;
}

nav button {
  background: #3b82f6;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h2 {
  font-size: 32px;
}

.hero p {
  color: #94a3b8;
}

/* CARDS */
.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  margin: 10px;
  border-radius: 12px;
  width: 250px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

/* BOTÃO */
.btn {
  display: block;
  margin-top: 10px;
  padding: 10px;
  text-align: center;
  background: #3b82f6;
  border-radius: 6px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  border-top: 1px solid #1e293b;
  color: #64748b;
}
<<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
  </script>/style>
</head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<body>

<!-- MENU -->
<nav>
  <h1>🚀 MeuSite</h1>
  <button onclick="alert('Login em breve')">Login</button>
</nav>

<!-- HERO -->
<section class="hero">
  <h2>Bem-vindo ao meu site</h2>
  <p>Um site moderno feito com HTML + GitHub Pages</p>
</section>

<!-- CARDS -->
<div class="container">

  <div class="card">
    <h3>Projeto 1</h3>
    <p>Descrição do projeto.</p>
    <div class="btn" onclick="alert('Abrindo...')">Abrir</div>
  </div>

  <div class="card">
    <h3>Projeto 2</h3>
    <p>Outro projeto legal.</p>
    <div class="btn" onclick="alert('Abrindo...')">Abrir</div>
  </div>

  <div class="card">
    <h3>Projeto 3</h3>
    <p>Mais um exemplo.</p>
    <div class="btn" onclick="alert('Abrindo...')">Abrir</div>
  </div>

</div>

<!-- RODAPÉ -->
<footer>
  © 2026 - Meu Site | Criado por você 😎
</footer>

</body>
</html>
